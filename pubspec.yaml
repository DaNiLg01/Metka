name: expense_tracker
description: Приложение учёта расходов по ТЗ МДК.05.02
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.2.1
  fl_chart: ^0.69.0
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^12.0.2 # ✅ ОБНОВЛЕНО для совместимости с Drift
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # ✅ НОВЫЕ: Drift (база данных SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # ✅ НОВЫЕ: для генерации кода Drift
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true